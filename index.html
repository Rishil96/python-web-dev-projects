<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Practice Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], input[type="file"], input[type="password"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        #success-message {
            display: none;
            color: green;
            font-weight: bold;
        }
        #iframeContainer {
            margin-top: 20px;
        }
        #dynamicContent {
            color: #007bff;
            cursor: pointer;
        }
    </style>
    <script>
        // Show popup function
        function showPopup() {
            document.getElementById("popup").style.display = "flex";
        }

        // Hide popup function
        function hidePopup() {
            document.getElementById("popup").style.display = "none";
        }

        // Dynamic content function
        function loadDynamicContent() {
            const content = document.getElementById("dynamicContent");
            content.innerHTML = "Content loaded!";
            content.style.color = "green";
        }

        // Show success message after form submission
        function showSuccess() {
            document.getElementById("success-message").style.display = "block";
        }
    </script>
</head>
<body>

    <h1>Selenium Practice Page</h1>

    <!-- Main container -->
    <div class="container">

        <!-- Form for form-filling practice -->
        <form id="testForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a password">
            </div>

            <div class="form-group">
                <label for="fileUpload">File Upload</label>
                <input type="file" id="fileUpload" name="fileUpload">
            </div>

            <div class="form-group">
                <label for="options">Options</label>
                <select id="options" name="options">
                    <option value="option1">Option 1</option>
                    <option value="option2">Option 2</option>
                    <option value="option3">Option 3</option>
                </select>
            </div>

            <button type="button" onclick="showSuccess()">Submit</button>
            <div id="success-message">Form Submitted Successfully!</div>
        </form>

        <!-- Button to trigger pop-up -->
        <button onclick="showPopup()">Show Popup</button>

        <!-- Popup for alert handling -->
        <div id="popup" class="popup" onclick="hidePopup()">
            <div class="popup-content">
                <p>This is a pop-up message. Click anywhere outside to close.</p>
            </div>
        </div>

        <!-- Dynamic content area -->
        <p id="dynamicContent" onclick="loadDynamicContent()">Click here to load dynamic content</p>

        <!-- Iframe for iframe handling practice -->
        <div id="iframeContainer">
            <iframe src="https://www.example.com" width="100%" height="200" title="Example Iframe"></iframe>
        </div>

    </div>

</body>
</html>

<!DOCTYPE HTML>

<html>
	<head>
		<title>Login</title>
	</head>
	<body>
        <div class="container">
		<h1>Login</h1>
		<!-- novalidate stops the inbuilt browser validation and depends on the validations written in code i.e. WTForm in our case	-->
        <form method="POST" action="{{ url_for('login') }}" novalidate>
			{{ form.csrf_token }}
			<p>
				{{ form.email.label }} <br> {{ form.email(size=30) }}
				<!--Error logging-->
				{% for error in form.email.errors %}
					<span style="color:red"> {{ error }} </span>
				{% endfor %}
			</p>
			<p>
				{{ form.password.label }} <br> {{ form.password(size=30) }}
				<!--Error logging-->
				{% for error in form.password.errors %}
					<span style="color:red"> {{ error }} </span>
				{% endfor %}
			</p>
				{{ form.submit }}
		</form>
        </div>
	</body>
</html>
